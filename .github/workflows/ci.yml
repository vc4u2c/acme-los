name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    name: Lint And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm run audit:node

      - name: Audit and restore .NET dependencies
        run: npm run dotnet:audit:ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Validate project tags
        run: npm run validate:tags

      - name: Lint affected projects
        run: npx nx affected -t lint

      - name: Test affected projects
        run: npx nx affected -t test

      # Optional once the workspace is connected to Nx Cloud.
      # - name: Self-heal CI
      #   if: always()
      #   run: npx nx fix-ci

  build_deployable_artifact:
    name: Build Deployable Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint_test
      - release_apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release_apps.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create deployable artifact bundle
        shell: bash
        run: |
          deploy_commit_sha="$(git rev-parse HEAD)"
          bundle_name="acme-los-web-app-deployable-${GITHUB_SHA}"
          web_version="$(node -p "require('./apps/web-app/package.json').version")"
          mobile_version="$(node -p "require('./apps/mobile-app/package.json').version")"
          bff_version="$(node -p "require('./apps/bff-api/src/Acme.Los.Bff.Api/package.json').version")"
          mkdir -p dist/deployable
          cp apps/web-app/package.json dist/deployable/web-app.package.json
          cp apps/mobile-app/package.json dist/deployable/mobile-app.package.json
          cp apps/bff-api/src/Acme.Los.Bff.Api/package.json dist/deployable/bff-api.package.json
          cat <<EOF > dist/deployable/deploy-metadata.json
          {
            "commitSha": "${deploy_commit_sha}",
            "workflowHeadSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "projectName": "web-app",
            "displayName": "ACME LOS Web App Deployable",
            "artifactName": "${bundle_name}",
            "deployableProjects": ["web-app", "bff-api"],
            "sourceProjects": ["web-app", "Acme.Los.Bff.Api"],
            "webVersion": "${web_version}",
            "mobileVersion": "${mobile_version}",
            "bffVersion": "${bff_version}"
          }
          EOF
          mkdir -p dist/artifacts
          tar -czf dist/artifacts/${bundle_name}.tgz -C dist/deployable .

      - name: Upload deployable artifact bundle
        uses: actions/upload-artifact@v6
        with:
          name: acme-los-web-app-deployable-${{ github.sha }}
          path: dist/artifacts/acme-los-web-app-deployable-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 30

  release_apps:
    name: Release Apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs:
      - lint_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.release_ref.outputs.sha }}
    env:
      # Use a dedicated release token when provided so protected-branch bypass
      # can be scoped to the automation path instead of general CI.
      RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' && secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_GIT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve versions before release
        id: versions_before
        shell: bash
        run: |
          echo "web=$(node -p "require('./apps/web-app/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "mobile=$(node -p "require('./apps/mobile-app/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "bff=$(node -p "require('./apps/bff-api/src/Acme.Los.Bff.Api/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release versions, tags, and GitHub releases
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_GIT_TOKEN }}
          GH_TOKEN: ${{ env.RELEASE_GIT_TOKEN }}
        run: npx nx release --skip-publish

      - name: Resolve versions after release
        id: versions_after
        shell: bash
        run: |
          web_version="$(node -p "require('./apps/web-app/package.json').version")"
          mobile_version="$(node -p "require('./apps/mobile-app/package.json').version")"
          bff_version="$(node -p "require('./apps/bff-api/src/Acme.Los.Bff.Api/package.json').version")"
          echo "web=$web_version" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile_version" >> "$GITHUB_OUTPUT"
          echo "bff=$bff_version" >> "$GITHUB_OUTPUT"

          if [[ "$web_version" != "${{ steps.versions_before.outputs.web }}" ]]; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$mobile_version" != "${{ steps.versions_before.outputs.mobile }}" ]]; then
            echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$bff_version" != "${{ steps.versions_before.outputs.bff }}" ]]; then
            echo "bff_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bff_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "web_asset_file=acme-los-web-app-${web_version}-release-bundle.tgz" >> "$GITHUB_OUTPUT"
          echo "mobile_asset_file=acme-los-mobile-app-${mobile_version}-release-bundle.tgz" >> "$GITHUB_OUTPUT"
          echo "bff_asset_file=acme-los-bff-api-${bff_version}-release-bundle.tgz" >> "$GITHUB_OUTPUT"

      - name: Resolve release ref
        id: release_ref
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release asset bundle
        if: steps.versions_after.outputs.web_changed == 'true' || steps.versions_after.outputs.mobile_changed == 'true' || steps.versions_after.outputs.bff_changed == 'true'
        shell: bash
        run: |
          mkdir -p dist/release-assets/web-app dist/release-assets/mobile-app dist/release-assets/bff-api dist/artifacts

          cp apps/web-app/package.json dist/release-assets/web-app/package.json
          cat <<EOF > dist/release-assets/web-app/release-metadata.json
          {
            "projectName": "web-app",
            "displayName": "ACME LOS Web App",
            "assetFileName": "${{ steps.versions_after.outputs.web_asset_file }}",
            "actionsArtifactName": "acme-los-web-app-release-assets-${{ steps.versions_after.outputs.web }}-${GITHUB_SHA}",
            "commitSha": "${{ steps.release_ref.outputs.sha }}",
            "workflowHeadSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "version": "${{ steps.versions_after.outputs.web }}"
          }
          EOF

          cp apps/mobile-app/package.json dist/release-assets/mobile-app/package.json
          cat <<EOF > dist/release-assets/mobile-app/release-metadata.json
          {
            "projectName": "mobile-app",
            "displayName": "ACME LOS Mobile App",
            "assetFileName": "${{ steps.versions_after.outputs.mobile_asset_file }}",
            "actionsArtifactName": "acme-los-mobile-app-release-assets-${{ steps.versions_after.outputs.mobile }}-${GITHUB_SHA}",
            "commitSha": "${{ steps.release_ref.outputs.sha }}",
            "workflowHeadSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "version": "${{ steps.versions_after.outputs.mobile }}"
          }
          EOF

          cp apps/bff-api/src/Acme.Los.Bff.Api/package.json dist/release-assets/bff-api/package.json
          cat <<EOF > dist/release-assets/bff-api/release-metadata.json
          {
            "projectName": "bff-api",
            "sourceProjectName": "Acme.Los.Bff.Api",
            "displayName": "ACME LOS BFF API",
            "assetFileName": "${{ steps.versions_after.outputs.bff_asset_file }}",
            "actionsArtifactName": "acme-los-bff-api-release-assets-${{ steps.versions_after.outputs.bff }}-${GITHUB_SHA}",
            "commitSha": "${{ steps.release_ref.outputs.sha }}",
            "workflowHeadSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "version": "${{ steps.versions_after.outputs.bff }}"
          }
          EOF

          tar -czf dist/artifacts/${{ steps.versions_after.outputs.web_asset_file }} -C dist/release-assets/web-app .
          tar -czf dist/artifacts/${{ steps.versions_after.outputs.mobile_asset_file }} -C dist/release-assets/mobile-app .
          tar -czf dist/artifacts/${{ steps.versions_after.outputs.bff_asset_file }} -C dist/release-assets/bff-api .

      - name: Upload web release asset bundle
        if: steps.versions_after.outputs.web_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: acme-los-web-app-release-assets-${{ steps.versions_after.outputs.web }}-${{ github.sha }}
          path: dist/artifacts/${{ steps.versions_after.outputs.web_asset_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile release asset bundle
        if: steps.versions_after.outputs.mobile_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: acme-los-mobile-app-release-assets-${{ steps.versions_after.outputs.mobile }}-${{ github.sha }}
          path: dist/artifacts/${{ steps.versions_after.outputs.mobile_asset_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload BFF API release asset bundle
        if: steps.versions_after.outputs.bff_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: acme-los-bff-api-release-assets-${{ steps.versions_after.outputs.bff }}-${{ github.sha }}
          path: dist/artifacts/${{ steps.versions_after.outputs.bff_asset_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach asset to web release
        if: steps.versions_after.outputs.web_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-app@${{ steps.versions_after.outputs.web }}
          name: ACME LOS Web App ${{ steps.versions_after.outputs.web }}
          files: dist/artifacts/${{ steps.versions_after.outputs.web_asset_file }}
          append_body: true
          fail_on_unmatched_files: true

      - name: Attach asset to mobile release
        if: steps.versions_after.outputs.mobile_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-app@${{ steps.versions_after.outputs.mobile }}
          name: ACME LOS Mobile App ${{ steps.versions_after.outputs.mobile }}
          files: dist/artifacts/${{ steps.versions_after.outputs.mobile_asset_file }}
          append_body: true
          fail_on_unmatched_files: true

      - name: Attach asset to BFF API release
        if: steps.versions_after.outputs.bff_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bff-api@${{ steps.versions_after.outputs.bff }}
          name: ACME LOS BFF API ${{ steps.versions_after.outputs.bff }}
          files: dist/artifacts/${{ steps.versions_after.outputs.bff_asset_file }}
          append_body: true
          fail_on_unmatched_files: true

      - name: Summarize release artifacts
        if: steps.versions_after.outputs.web_changed == 'true' || steps.versions_after.outputs.mobile_changed == 'true' || steps.versions_after.outputs.bff_changed == 'true'
        shell: bash
        run: |
          {
            echo "## Release Artifacts"
            echo ""
            if [[ "${{ steps.versions_after.outputs.web_changed }}" == "true" ]]; then
              echo "- Web Actions artifact: \`acme-los-web-app-release-assets-${{ steps.versions_after.outputs.web }}-${GITHUB_SHA}\`"
              echo "- Web release asset: \`${{ steps.versions_after.outputs.web_asset_file }}\`"
            fi
            if [[ "${{ steps.versions_after.outputs.mobile_changed }}" == "true" ]]; then
              echo "- Mobile Actions artifact: \`acme-los-mobile-app-release-assets-${{ steps.versions_after.outputs.mobile }}-${GITHUB_SHA}\`"
              echo "- Mobile release asset: \`${{ steps.versions_after.outputs.mobile_asset_file }}\`"
            fi
            if [[ "${{ steps.versions_after.outputs.bff_changed }}" == "true" ]]; then
              echo "- BFF API Actions artifact: \`acme-los-bff-api-release-assets-${{ steps.versions_after.outputs.bff }}-${GITHUB_SHA}\`"
              echo "- BFF API release asset: \`${{ steps.versions_after.outputs.bff_asset_file }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
