name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    name: Lint And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Validate project tags
        run: npm run validate:tags

      - name: Lint affected projects
        run: npx nx affected -t lint

      - name: Test affected projects
        run: npx nx affected -t test --runInBand

      # Optional once the workspace is connected to Nx Cloud.
      # - name: Self-heal CI
      #   if: always()
      #   run: npx nx fix-ci
