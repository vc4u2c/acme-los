name: Deploy Dev

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name to deploy
        required: true
        type: string
      artifact_run_id:
        description: Workflow run ID that produced the artifact
        required: true
        type: string
      source_ref:
        description: Source ref recorded for the artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy_dev:
    name: Deploy To Dev
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          path: dist/deployable

      - name: Placeholder deploy
        run: |
          echo "Deploying artifact to dev environment"
          echo "Artifact name: ${{ inputs.artifact_name }}"
          echo "Artifact run ID: ${{ inputs.artifact_run_id }}"
          echo "Source ref: ${{ inputs.source_ref }}"
          echo "Replace this step with the real dev deployment command"
