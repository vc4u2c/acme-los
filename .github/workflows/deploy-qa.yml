name: Deploy QA

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name to deploy
        required: true
        type: string
      artifact_run_id:
        description: Workflow run ID that produced the artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy_qa:
    name: Deploy To QA
    runs-on: ubuntu-latest
    environment:
      name: qa

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          path: dist/deployable

      - name: Placeholder deploy
        run: |
          echo "Deploying selected artifact to qa environment"
          echo "Artifact name: ${{ inputs.artifact_name }}"
          echo "Artifact run ID: ${{ inputs.artifact_run_id }}"
          echo "Replace this step with the real QA deployment command"
