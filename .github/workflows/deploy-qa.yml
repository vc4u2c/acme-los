name: Deploy QA

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name to deploy
        required: true
        type: string
      artifact_run_id:
        description: Workflow run ID that produced the artifact
        required: true
        type: string
      source_ref:
        description: Source ref recorded for the artifact
        required: false
        default: ''
        type: string

jobs:
  deploy_qa:
    name: Deploy To QA
    uses: ./.github/workflows/deploy-web-environment.yml
    permissions:
      id-token: write
      actions: read
      contents: read
    secrets: inherit
    with:
      environment_name: qa
      artifact_name: ${{ inputs.artifact_name }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      source_ref: ${{ inputs.source_ref }}
      bicep_parameter_file: infra/azure/bicep/qa.bicepparam
