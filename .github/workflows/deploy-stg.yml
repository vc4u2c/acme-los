name: Promote Staging (Demo)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name to promote in the demo
        required: true
        type: string
      artifact_run_id:
        description: Workflow run ID that produced the artifact
        required: true
        type: string
      source_ref:
        description: Source ref recorded for the artifact
        required: false
        default: ''
        type: string

jobs:
  deploy_stg:
    name: Promote To Staging (Simulation)
    runs-on: ubuntu-latest
    environment:
      name: stg
    permissions:
      contents: read

    steps:
      - name: Record staging promotion simulation
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          echo "SIMULATION ONLY: no staging infrastructure or application was changed."
          echo "Approved artifact: ${ARTIFACT_NAME}"
          echo "Source CI run: ${ARTIFACT_RUN_ID}"
          echo "Source commit: ${SOURCE_REF}"
          {
            echo "## Staging Promotion (Simulation)"
            echo ""
            echo "- Result: approved and recorded"
            echo "- Cloud changes: none"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Source CI run: \`${ARTIFACT_RUN_ID}\`"
            echo "- Source commit: \`${SOURCE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
