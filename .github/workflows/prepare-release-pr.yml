name: Prepare Release PR

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-pr
  cancel-in-progress: false

jobs:
  prepare_release_pr:
    name: Prepare Release Versions
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Detect release-only merge
        id: release_only_merge
        shell: bash
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          if [[ -z "$changed_files" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_only="true"
          while IFS= read -r file; do
            case "$file" in
              apps/web-app/package.json|apps/mobile-app/package.json|apps/web-app/CHANGELOG.md|apps/mobile-app/CHANGELOG.md)
                ;;
              *)
                release_only="false"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "skip=$release_only" >> "$GITHUB_OUTPUT"

      - name: Prepare next app versions
        if: steps.release_only_merge.outputs.skip != 'true'
        shell: bash
        run: |
          FIRST_RELEASE_FLAG=""
          if [[ -z "$(git tag --list 'web-app@*')" && -z "$(git tag --list 'mobile-app@*')" ]]; then
            FIRST_RELEASE_FLAG="--first-release"
          fi

          npx nx release version --git-commit=false --git-tag=false --git-push=false --stage-changes=false $FIRST_RELEASE_FLAG

      - name: Create release pull request
        if: steps.release_only_merge.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/prepare
          delete-branch: false
          commit-message: 'chore(release): prepare app releases'
          title: 'chore(release): prepare app releases'
          body: |
            This PR prepares the next application release.

            Included changes:
            - updates app manifest versions

            Merge this PR when you are ready to publish tags and GitHub Releases.
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
