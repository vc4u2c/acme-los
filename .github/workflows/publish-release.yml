name: Publish Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Detect release merge
        id: release_merge
        shell: bash
        run: |
          web_changed="false"
          mobile_changed="false"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if ! git diff --quiet HEAD^ HEAD -- apps/web-app/package.json; then
              web_changed="true"
            fi

            if ! git diff --quiet HEAD^ HEAD -- apps/mobile-app/package.json; then
              mobile_changed="true"
            fi
          fi

          echo "web_changed=$web_changed" >> "$GITHUB_OUTPUT"
          echo "mobile_changed=$mobile_changed" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.release_merge.outputs.web_changed == 'true' || steps.release_merge.outputs.mobile_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish web release
        if: steps.release_merge.outputs.web_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./apps/web-app/package.json').version")"
          first_release_flag=""

          if [[ -z "$(git tag --list 'web-app@*')" ]]; then
            first_release_flag="--first-release"
          fi

          npx nx release changelog "$version" --groups web --git-commit=false --git-tag=true --git-push=true $first_release_flag

      - name: Resolve web version
        if: steps.release_merge.outputs.web_changed == 'true'
        id: web_version
        shell: bash
        run: echo "version=$(node -p "require('./apps/web-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create web GitHub Release
        if: steps.release_merge.outputs.web_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-app@${{ steps.web_version.outputs.version }}
          generate_release_notes: true

      - name: Publish mobile release
        if: steps.release_merge.outputs.mobile_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./apps/mobile-app/package.json').version")"
          first_release_flag=""

          if [[ -z "$(git tag --list 'mobile-app@*')" ]]; then
            first_release_flag="--first-release"
          fi

          npx nx release changelog "$version" --groups mobile --git-commit=false --git-tag=true --git-push=true $first_release_flag

      - name: Resolve mobile version
        if: steps.release_merge.outputs.mobile_changed == 'true'
        id: mobile_version
        shell: bash
        run: echo "version=$(node -p "require('./apps/mobile-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create mobile GitHub Release
        if: steps.release_merge.outputs.mobile_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-app@${{ steps.mobile_version.outputs.version }}
          generate_release_notes: true
