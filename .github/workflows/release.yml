name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      group:
        description: Release scope to run
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - mobile
      dry_run:
        description: Run Nx Release in dry-run mode
        required: true
        default: true
        type: boolean
      first_release:
        description: Treat this as the first release for the selected scope
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Verify workspace
        run: |
          npm run validate:tags
          npx nx run-many -t lint
          npx nx run-many -t test --runInBand

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Nx Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GROUP="all"
          DRY_RUN="false"
          FIRST_RELEASE_INPUT="false"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            GROUP="${{ github.event.inputs.group }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            FIRST_RELEASE_INPUT="${{ github.event.inputs.first_release }}"
          fi

          FIRST_RELEASE_FLAG=""
          if [[ "$FIRST_RELEASE_INPUT" == "true" ]]; then
            FIRST_RELEASE_FLAG="--first-release"
          elif [[ -z "$(git tag --list 'web-app@*')" && -z "$(git tag --list 'mobile-app@*')" ]]; then
            FIRST_RELEASE_FLAG="--first-release"
          fi

          if [[ "$GROUP" == "web" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              npx nx release --groups web --dry-run $FIRST_RELEASE_FLAG
            else
              npx nx release --groups web $FIRST_RELEASE_FLAG
            fi
          elif [[ "$GROUP" == "mobile" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              npx nx release --groups mobile --dry-run $FIRST_RELEASE_FLAG
            else
              npx nx release --groups mobile $FIRST_RELEASE_FLAG
            fi
          else
            if [[ "$DRY_RUN" == "true" ]]; then
              npx nx release --dry-run $FIRST_RELEASE_FLAG
            else
              npx nx release $FIRST_RELEASE_FLAG
            fi
          fi
