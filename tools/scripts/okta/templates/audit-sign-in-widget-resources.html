<script>
  window.OktaSignIn = function OktaSignIn(config) {
    this.config = config;
    this.handlers = {};
    this.transforms = [];
    window.__ACME_LAST_WIDGET_CONFIG__ = config;
    window.__ACME_AFTER_TRANSFORM_REGISTRATIONS__ = [];
  };

  window.OktaSignIn.prototype.on = function on(eventName, handler) {
    this.handlers[eventName] = this.handlers[eventName] || [];
    this.handlers[eventName].push(handler);
  };

  window.OktaSignIn.prototype.emit = function emit(eventName, context) {
    (this.handlers[eventName] || []).forEach(function callHandler(handler) {
      handler(context);
    });
  };

  window.OktaSignIn.prototype.afterTransform = function afterTransform(
    formName,
    handler,
  ) {
    this.transforms.push({ formName: formName, handler: handler });
    window.__ACME_AFTER_TRANSFORM_REGISTRATIONS__.push(formName);
  };

  window.OktaSignIn.prototype.renderEl = function renderEl(target) {
    var container = document.querySelector(target.el);

    if (!container) {
      return;
    }

    var i18n = (this.config.i18n && this.config.i18n.en) || {};
    var links = this.config.helpLinks || {};
    var forgotHref = links.forgotPassword || '#';
    var unlockHref = links.unlock || '#';
    var customLinks = Array.isArray(links.custom) ? links.custom : [];
    var searchParams = new URL(window.location.href).searchParams;
    var renderSignupValidationError = searchParams.has(
      'acme_audit_signup_error',
    );
    var renderAuthenticatorReturnLink = searchParams.has(
      'acme_audit_authenticator_link',
    );
    var renderEmailEnrollment = searchParams.has('acme_audit_email_enrollment');
    var flow = renderEmailEnrollment
      ? 'emailEnrollment'
      : this.config.flow || 'signIn';
    var contextByFlow = {
      signIn: { formName: 'identify' },
      signup: { formName: 'enroll-profile' },
      emailEnrollment: {
        formName: 'enroll-authenticator-verification',
        authenticatorKey: 'okta_email',
      },
      resetPassword: { formName: 'identify' },
      unlockAccount: { formName: 'unlock-account' },
    };

    function copy(key, fallback) {
      return String(i18n[key] || fallback);
    }

    function applyTransforms(formName, elements) {
      var formBag = {
        uischema: {
          elements: elements.slice(),
        },
      };

      this.transforms.forEach(function applyTransform(registration) {
        if (
          registration.formName === '*' ||
          registration.formName === formName
        ) {
          registration.handler({
            formBag: formBag,
            formName: formName,
          });
        }
      });

      return formBag.uischema.elements || [];
    }

    function field(label, type) {
      return [
        '<div class="MuiFormControl-root o-form-fieldset" data-se="o-form-fieldset-' +
          label.toLowerCase().replace(/[^a-z0-9]+/g, '-') +
          '">',
        '<label class="MuiFormLabel-root MuiInputLabel-root">' +
          label +
          '</label>',
        '<div class="MuiInputBase-root MuiOutlinedInput-root">',
        '<input class="MuiInputBase-input MuiOutlinedInput-input" type="' +
          type +
          '" />',
        '<fieldset class="MuiOutlinedInput-notchedOutline"></fieldset>',
        '</div>',
        '</div>',
      ].join('');
    }

    function selectField(label) {
      return [
        '<div class="MuiFormControl-root o-form-fieldset" data-se="o-form-fieldset-' +
          label.toLowerCase().replace(/[^a-z0-9]+/g, '-') +
          '">',
        '<label class="MuiFormLabel-root MuiInputLabel-root">' +
          label +
          '</label>',
        '<div class="MuiInputBase-root MuiOutlinedInput-root MuiSelect-root">',
        '<div class="MuiSelect-select">Select an option</div>',
        '<input class="MuiSelect-nativeInput" aria-hidden="true" tabindex="-1" />',
        '<fieldset class="MuiOutlinedInput-notchedOutline"></fieldset>',
        '</div>',
        '</div>',
      ].join('');
    }

    function button(text) {
      return (
        '<div class="o-form-button-bar"><button class="MuiButton-root button button-primary" type="submit">' +
        text +
        '</button></div>'
      );
    }

    function linkElement(text, href, dataSe) {
      return {
        type: 'Link',
        label: text,
        options: {
          dataSe: dataSe,
          href: href,
        },
      };
    }

    function linkHtml(element) {
      return (
        '<a data-se="' +
        String(element.options.dataSe || '') +
        '" href="' +
        String(element.options.href || '#') +
        '">' +
        String(element.label || '') +
        '</a>'
      );
    }

    function linksHtml(formName, elements) {
      return applyTransforms
        .call(this, formName, elements)
        .map(linkHtml)
        .join('');
    }

    function customHelpLinks() {
      return customLinks.map(function toLink(link) {
        return linkElement(
          String(link.text || ''),
          String(link.href || '#'),
          'custom',
        );
      });
    }

    function shell(flowName, title, body, footer) {
      return [
        '<div id="okta-sign-in" class="MuiPaper-root MuiCard-root auth-container main-container" data-audit-flow="' +
          flowName +
          '">',
        '<div class="MuiBox-root siw-main-view">',
        '<div class="MuiBox-root auth-content"><div class="MuiBox-root siw-main-body">',
        '<h2 class="MuiTypography-root okta-form-title">' + title + '</h2>',
        '<form class="o-form"><div class="MuiBox-root o-form-content">' +
          body +
          '</div></form>',
        '</div></div>',
        footer ? '<div class="siw-main-footer">' + footer + '</div>' : '',
        '</div></div>',
      ].join('');
    }

    var contentByFlow = {
      signIn: shell(
        'signIn',
        'Sign in',
        field('Email', 'email') + button('Continue'),
        linksHtml.call(this, 'identify', [
          linkElement('Forgot password?', forgotHref, 'forgot-password'),
          linkElement('Unlock account', unlockHref, 'unlock'),
          linkElement('Help', '/help/login', 'help'),
          linkElement('Continue to login', '/app/UserHome', 'delayed-sign-on'),
        ]),
      ),
      signup: shell(
        'signup',
        'Create account',
        (renderSignupValidationError
          ? '<div role="alert">An account already exists for this email.</div>'
          : '') +
          field('Email', 'email') +
          field('First name', 'text') +
          field('Last name', 'text') +
          selectField('State') +
          button('Continue'),
        linksHtml.call(
          this,
          'enroll-profile',
          [
            linkElement(
              'Sign in',
              renderSignupValidationError ? window.location.href : '#',
              'sign-in',
            ),
            linkElement('Go back to sign on', '/app/UserHome', 'sign-on'),
            renderAuthenticatorReturnLink
              ? linkElement(
                  'Back to authenticator',
                  '#',
                  'select-authenticator',
                )
              : null,
            linkElement(
              'Continue to login',
              '/app/UserHome',
              'delayed-sign-on',
            ),
          ].filter(Boolean),
        ),
      ),
      emailEnrollment: shell(
        'emailEnrollment',
        copy('email.enroll.title', 'Set up Email Authentication'),
        '<p>' +
          copy(
            'email.enroll.description',
            'Send a verification code to your registered email.',
          ) +
          '</p>' +
          button(copy('email.button.send', 'Send me the code')),
        linksHtml.call(this, 'enroll-authenticator-verification', [
          linkElement('Back to authenticator', '#', 'select-authenticator'),
          linkElement('Set up another', '#', 'setup-another'),
          linkElement('Continue to login', '/app/UserHome', 'delayed-sign-on'),
        ]),
      ),
      resetPassword: shell(
        'resetPassword',
        'Forgot password',
        field('Email', 'email') + button('Send recovery code'),
        linksHtml.call(
          this,
          'identify',
          customHelpLinks().concat([
            linkElement(
              'Continue to login',
              '/app/UserHome',
              'delayed-sign-on',
            ),
          ]),
        ),
      ),
      unlockAccount: shell(
        'unlockAccount',
        'Unlock account',
        field('Email', 'email') + button('Send unlock code'),
        linksHtml.call(
          this,
          'unlock-account',
          customHelpLinks().concat([
            linkElement(
              'Continue to login',
              '/app/UserHome',
              'delayed-sign-on',
            ),
          ]),
        ),
      ),
    };

    container.innerHTML = contentByFlow[flow] || contentByFlow.signIn;
    this.emit('afterRender', contextByFlow[flow] || contextByFlow.signIn);
  };
</script>
