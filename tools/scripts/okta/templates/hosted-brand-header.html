<header class="acme-brand-header">
  <div class="acme-brand-header__inner">
    <div
      class="acme-brand-header__lockup"
      role="img"
      aria-label="%%BRAND_LABEL%% %%PRODUCT_LABEL%%"
    >
      <span class="acme-brand-header__mark">
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path
            d="M32 11 16.5 50h7.2l3.15-8.55h10.3L40.3 50h7.2L32 11Zm-2.55 22.3L32 25.55l2.55 7.75h-5.1Z"
            fill="var(--acme-brand-contrast)"
          />
          <path
            d="M43.5 16h5.9v5.9h-5.9z"
            fill="var(--acme-brand-contrast)"
            opacity="0.74"
          />
        </svg>
      </span>
      <span class="acme-brand-header__copy">
        <span class="acme-brand-header__eyebrow">%%BRAND_LABEL%%</span>
        <span class="acme-brand-header__title">%%PRODUCT_LABEL%%</span>
      </span>
    </div>
    <div class="acme-theme-toggle" role="group" aria-label="Color theme">
      <button
        class="acme-theme-toggle__button"
        type="button"
        data-acme-theme-choice="light"
        aria-label="Use light mode"
        title="Light mode"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle
            cx="12"
            cy="12"
            r="3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
          />
          <path
            d="M12 2.75v2.1M12 19.15v2.1M21.25 12h-2.1M4.85 12h-2.1M18.55 5.45l-1.48 1.48M6.93 17.07l-1.48 1.48M18.55 18.55l-1.48-1.48M6.93 6.93 5.45 5.45"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="1.9"
          />
        </svg>
      </button>
      <button
        class="acme-theme-toggle__button"
        type="button"
        data-acme-theme-choice="dark"
        aria-label="Use dark mode"
        title="Dark mode"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M20 15.35A7.85 7.85 0 0 1 8.65 4a7.86 7.86 0 1 0 11.35 11.35Z"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.9"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
