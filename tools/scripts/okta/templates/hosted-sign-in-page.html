<!doctype html>
<html lang="en">
  <head>

    <!-- %%THEME_BOOTSTRAP_SCRIPT%% -->

    <!-- %%THEME_STYLE_MARKUP%% -->
    <style nonce="{{nonceValue}}">
      html,
      body {
        min-height: 100%;
        max-width: 100%;
        overflow-x: clip;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        color: var(--acme-text);
        background:
          radial-gradient(
            ellipse at top right,
            var(--acme-hero-glow-top) 0%,
            transparent 68%
          ),
          radial-gradient(
            ellipse at top left,
            var(--acme-hero-glow-side) 0%,
            transparent 72%
          ),
          linear-gradient(
            180deg,
            var(--acme-background-top) 0%,
            var(--acme-background) 22%,
            var(--acme-background) 100%
          );
        background-position:
          top right,
          top left,
          top left;
        background-repeat: no-repeat;
        background-size:
          var(--acme-hero-glow-top-size),
          var(--acme-hero-glow-side-size),
          100% 100%;
        font-family: var(--acme-font-body);
        overflow-x: hidden;
      }

      #login-bg-image-id {
        display: none !important;
        background-image: none !important;
      }

      .acme-brand-header {
        position: relative;
        z-index: 1;
        border-bottom: 1px solid var(--acme-border);
        background: var(--acme-surface);
        box-shadow: var(--acme-header-shadow);
      }

      .acme-brand-header__inner {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 0.65rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .acme-brand-header__lockup {
        display: inline-flex;
        align-items: center;
        gap: 0.9rem;
        min-width: 0;
        max-width: 100%;
      }

      .acme-brand-header__mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 1rem;
        flex-shrink: 0;
        background: var(--acme-brand);
        box-shadow: 0 12px 24px var(--acme-brand-shadow);
      }

      .acme-brand-header__mark svg {
        width: 1.16rem;
        height: 1.16rem;
        display: block;
      }

      .acme-brand-header__copy {
        display: inline-flex;
        flex-direction: column;
        min-width: 0;
        max-width: 100%;
      }

      .acme-brand-header__eyebrow {
        color: var(--acme-muted-text);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .acme-brand-header__title {
        color: var(--acme-text);
        font-family: var(--acme-font-display);
        font-size: 1.22rem;
        line-height: 1.05;
      }

      .acme-theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        padding: 0.18rem;
        border: 1px solid var(--acme-border);
        border-radius: 999px;
        background: var(--acme-surface-strong);
        flex-shrink: 0;
      }

      .acme-theme-toggle__button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.82rem;
        height: 1.82rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--acme-muted-text);
        cursor: pointer;
      }

      .acme-theme-toggle__button[aria-pressed='true'] {
        background: var(--acme-brand);
        color: var(--acme-brand-contrast);
      }

      .acme-theme-toggle__button svg {
        width: 0.92rem;
        height: 0.92rem;
        display: block;
      }

      .acme-auth-shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 31rem;
        margin: 0 auto;
        padding: 1.35rem 1rem 1.15rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: clip;
      }

      .acme-auth-intro {
        margin: 0 0 0.75rem;
        text-align: center;
        width: 100%;
      }

      .acme-auth-eyebrow {
        margin: 0 0 0.55rem;
        color: var(--acme-muted-text);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .acme-auth-title {
        margin: 0;
        color: var(--acme-text);
        font-size: 1.55rem;
        line-height: 1.12;
        font-family: var(--acme-font-display);
      }

      .acme-auth-subtitle {
        margin: 0.5rem 0 0;
        color: var(--acme-muted-text);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .acme-auth-guidance {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin: 0.7rem 0 0.85rem;
        padding: 0.62rem 0.78rem;
        border: 1px solid var(--acme-border);
        border-radius: 0.95rem;
        background: var(--acme-guidance-bg);
        color: var(--acme-muted-text);
        font-size: 0.84rem;
        line-height: 1.45;
        text-align: center;
      }

      .acme-auth-footer {
        width: 100%;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--acme-border);
        text-align: center;
      }

      .acme-auth-support {
        text-align: center;
        color: var(--acme-muted-text);
        font-size: 0.9rem;
        line-height: 1.55;

      .acme-auth-support {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.35rem 0.55rem;
        margin-top: 0.7rem;
      }

      .acme-auth-support__divider {
        color: var(--acme-border-strong);
      }

      #okta-login-container .siw-main-body p span,
      #okta-login-container .siw-main-body p em {

      #okta-login-container select,
      #okta-login-container textarea,
      #okta-login-container

    <!-- %%THEME_CONTROLLER_SCRIPT%% -->
    {{{OktaUtil}}}

    <script type="text/javascript" nonce="{{nonceValue}}">
      var copy = JSON.parse('%%TITLE_COPY_JSON%%');
      var stateCopy = {
        signIn: {
          eyebrow: 'Customer sign in',
          title: copy.signInTitle,
          subtitle: copy.signInSubtitle,
          guidance:
            'Use the same secure account for application progress, disclosures, and funding updates.',
        },
        signUp: {
          eyebrow: 'Account setup',
          title: copy.signUpTitle,
          subtitle: copy.signUpSubtitle,
          guidance:
            'Registration includes contact verification and the security steps you will use later.',
        },
        enroll: {
          eyebrow: 'Security setup',
          title: 'Set up your verification methods',
          subtitle:
            'Choose the verification methods that will protect future sign-in, account changes, and funding actions.',
          guidance:
            'A few minutes here makes later sign-in and funding confirmation much smoother.',
        },
        verify: {
          eyebrow: 'Security verification',
          title: 'Verify your identity',
          subtitle:
            'Complete the next security check so we can protect the account and keep the application moving.',
          guidance:
            'We only ask for the next proof step needed for this session.',
        },
        recovery: {
          eyebrow: 'Account recovery',
          title: 'Recover secure access',
          subtitle:
            'We will confirm it is really you before password reset or account recovery can continue.',
          guidance:
            'Recovery checks help protect the account before access is restored.',
        },
        password: {
          eyebrow: 'Password update',
          title: 'Create a new password',
          subtitle:
            'Choose a strong password so your future sign-in stays protected.',
          guidance: 'Use a password you do not reuse anywhere else.',
        },
      };

      function getRequestUrl() {
        return new URL(window.location.href);
      }

      function normalizeRecoveryFlow(flow) {
        return flow === 'resetPassword' || flow === 'unlockAccount'
          ? flow
          : null;
      }

      function getRecoveryFlowHash(flow) {
        return flow === 'unlockAccount' ? '#unlock-account' : '#reset-password';
      }

      function getRecoveryFlowFromHash() {
        var hash = (window.location.hash || '').replace(/^#/, '').toLowerCase();
        if (hash === 'reset-password' || hash === 'forgot-password') {
          return 'resetPassword';
        }
        if (hash === 'unlock-account') {
          return 'unlockAccount';
        }
        return null;
      }

      function setRecoveryFlowHash(flow, replace) {
        var nextHash = getRecoveryFlowHash(flow);
        if (window.location.hash === nextHash) {
          return;
        }

        if (
          window.history &&
          window.history[replace ? 'replaceState' : 'pushState']
        ) {
          window.history[replace ? 'replaceState' : 'pushState'](
            { acmeOktaFlow: flow },
            '',
            nextHash,
          );
          return;
        }

        window.location.hash = nextHash;
      }

      function routeToHostedRecoveryFlow(event, flow, options) {
        var nextFlow = normalizeRecoveryFlow(flow);
        if (!nextFlow) {
          return;
        }

        if (event) {
          event.preventDefault();
          event.stopPropagation();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }

        setRecoveryFlowHash(nextFlow, Boolean(options && options.replace));
        renderOktaWidget(nextFlow);
      }

      function activateForgotPasswordExperience(event) {
        routeToHostedRecoveryFlow(event, 'resetPassword');
      }

      function activateUnlockAccountExperience(event) {
        routeToHostedRecoveryFlow(event, 'unlockAccount');
      }

      function isSignupFlow() {
        return getRequestUrl().searchParams.get('screen_hint') === 'signup';
      }

      function isRecoveryFlowRequest() {
        return Boolean(getRecoveryFlowFromHash());
      }

      function normalizeText(value) {
        return (value || '').replace(/\\s+/g, ' ').trim().toLowerCase();
      }

      function getWidgetHeadingText() {
        var heading = document.querySelector(
          '#okta-login-container .okta-form-title, #okta-login-container .siw-main-header h2, #okta-login-container .siw-main-header h3, #okta-login-container h2, #okta-login-container h3',
        );

        return heading ? heading.textContent.trim() : '';
      }

      function deriveExperienceState() {
        var widgetHeading = getWidgetHeadingText();
        var normalizedHeading = normalizeText(widgetHeading);

        if (
          normalizedHeading.indexOf('reset password') !== -1 ||
          normalizedHeading.indexOf('set password') !== -1 ||
          normalizedHeading.indexOf('create password') !== -1
        ) {
          return { key: 'password', widgetHeading: widgetHeading };
        }

        if (
          normalizedHeading.indexOf('unlock account') !== -1 ||
          normalizedHeading.indexOf('recover') !== -1 ||
          normalizedHeading.indexOf('forgot password') !== -1 ||
          isRecoveryFlowRequest()
        ) {
          return { key: 'recovery', widgetHeading: widgetHeading };
        }

        if (
          normalizedHeading.indexOf('select authenticator') !== -1 ||
          normalizedHeading.indexOf('enroll authenticator') !== -1 ||
          normalizedHeading.indexOf('set up') !== -1 ||
          normalizedHeading.indexOf('security method') !== -1
        ) {
          return {
            key:
              normalizedHeading.indexOf('verify') !== -1 ? 'verify' : 'enroll',
            widgetHeading: widgetHeading,
          };
        }

        if (
          normalizedHeading.indexOf('verify') !== -1 ||
          normalizedHeading.indexOf('challenge') !== -1 ||
          normalizedHeading.indexOf('passcode') !== -1 ||
          normalizedHeading.indexOf('enter code') !== -1 ||
          normalizedHeading.indexOf('push') !== -1 ||
          normalizedHeading.indexOf('approve') !== -1
        ) {
          return { key: 'verify', widgetHeading: widgetHeading };
        }

        if (
          normalizedHeading.indexOf('create account') !== -1 ||
          normalizedHeading.indexOf('sign up') !== -1 ||
          normalizedHeading.indexOf('register') !== -1
        ) {
          return { key: 'signUp', widgetHeading: widgetHeading };
        }

        if (isSignupFlow()) {
          return { key: 'signUp', widgetHeading: widgetHeading };
        }

        return { key: 'signIn', widgetHeading: widgetHeading };
      }

      function resolveStateCopy() {
        var state = deriveExperienceState();
        var nextCopy = stateCopy[state.key] || stateCopy.signIn;
        var nextTitle = nextCopy.title;

        if (
          state.widgetHeading &&
          ['enroll', 'verify', 'recovery', 'password'].indexOf(state.key) !== -1
        ) {
          nextTitle = state.widgetHeading;
        }

        return {
          key: state.key,
          eyebrow: nextCopy.eyebrow,
          title: nextTitle,
          subtitle: nextCopy.subtitle,
          guidance: nextCopy.guidance,
        };
      }

      function updateExperienceCopy() {
        var nextCopy = resolveStateCopy();
        var eyebrow = document.getElementById('acme-auth-eyebrow');
        var title = document.getElementById('acme-auth-title');
        var subtitle = document.getElementById('acme-auth-subtitle');
        var guidance = document.getElementById('acme-auth-guidance');

        if (eyebrow) {
          eyebrow.textContent = nextCopy.eyebrow;
        }

        if (title) {
          title.textContent = nextCopy.title;
        }

        if (subtitle) {
          subtitle.textContent = nextCopy.subtitle;
        }

        if (guidance) {
          guidance.textContent = nextCopy.guidance || '';
        }

        document.body.setAttribute('data-acme-auth-state', nextCopy.key);
      }

      function getAuthenticatorTypeFromText(text) {
        var normalized = normalizeText(text);
        if (normalized.indexOf('password') !== -1) {
          return 'password';
        }
        if (normalized.indexOf('email') !== -1) {
          return 'email';
        }
        if (
          normalized.indexOf('phone') !== -1 ||
          normalized.indexOf('sms') !== -1
        ) {
          return 'phone';
        }
        return 'generic';
      }

      function getAuthenticatorGlyphMarkup(type) {
        if (type === 'password') {
          return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 10V8a5 5 0 0 1 10 0v2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 13.75v2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
        }
        if (type === 'email') {
          return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="6.5" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m5.5 8 6.5 5 6.5-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
        if (type === 'phone') {
          return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7.25" y="3.5" width="9.5" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10 6.5h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="17.25" r="0.9" fill="currentColor"/></svg>';
        }
        return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4.5 6 7.25v4.1c0 3.55 2.48 6.85 6 7.65 3.52-.8 6-4.1 6-7.65v-4.1L12 4.5Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="m9.5 12 1.7 1.7 3.3-3.45" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }

      function enhanceAuthenticatorOptions() {
        var items = document.querySelectorAll(
          '#okta-login-container .authenticator-enrollments-list li, #okta-login-container .authenticator-list li, #okta-login-container .authenticator-verify-list li',
        );

        Array.prototype.forEach.call(items, function (item) {
          var type = getAuthenticatorTypeFromText(item.textContent || '');

          item.classList.add('acme-authenticator-item');
          item.setAttribute('data-acme-authenticator', type);

          var action = item.querySelector(
            '.button, button, input[type="button"], input[type="submit"]',
          );
          if (action) {
            action.classList.add('acme-authenticator-action');
            if (
              action.parentElement &&
              action.parentElement !== item &&
              action.tagName &&

      function prepareInlineFieldError(errorNode) {
        if (!errorNode || errorNode.nodeType !== 1) {

          .call(errorNode.childNodes)
          .forEach(function (child) {

            textNode.textContent = text.trim();
            errorNode.insertBefore(textNode, child);
            child.remove();

        var children = Array.prototype.slice.call(errorNode.children || []);
        var icon =
          children.find(isLikelyFieldErrorIcon) ||
          errorNode.querySelector(
            '.error-16-small, .error-16, .icon-16, [class*="error-16"], [class*="icon-16"]',
          );

        if (icon) {
          icon.classList.add('acme-inline-field-error__icon');

      function enhanceInputErrors() {

      function escapeCssIdentifier(value) {

        }
      }

      function validatePasswordConfirmation(form, options) {
        var confirmInput = form
          ? form.querySelector('[data-acme-confirm-password="true"]')
          : null;
        if (!confirmInput || !isVisibleControl(confirmInput)) {
          return true;
        }

        var passwordInput = Array.prototype.find.call(
          form.querySelectorAll('input[type="password"]'),
          function (candidate) {
            return (
              candidate !== confirmInput && isPrimaryPasswordControl(candidate)
            );
          },
        );
        if (!passwordInput) {
          return true;
        }

        var showErrors = Boolean(options && options.showErrors);
        var passwordValue = passwordInput.value || '';
        var confirmValue = confirmInput.value || '';

        if (passwordValue.length === 0 && confirmValue.length === 0) {
          clearPasswordConfirmationError(confirmInput);
          return true;
        }

        if (passwordValue !== confirmValue) {
          if (showErrors || confirmValue.length > 0) {
            setPasswordConfirmationError(
              confirmInput,
              confirmValue.length === 0
                ? 'Repeat the password to continue.'
                : 'Passwords must match.',
            );
          }
          return false;
        }

        clearPasswordConfirmationError(confirmInput);
        return true;
      }

      function bindPasswordConfirmationForm(form) {
        if (!form || form.getAttribute('data-acme-confirm-password-bound')) {
          return;
        }

        form.setAttribute('data-acme-confirm-password-bound', 'true');
        form.addEventListener(
          'submit',
          function (event) {
            if (!validatePasswordConfirmation(form, { showErrors: true })) {
              event.preventDefault();
              event.stopImmediatePropagation();
              var confirmInput = form.querySelector(
                '[data-acme-confirm-password="true"]',
              );
              if (confirmInput) {
                confirmInput.focus();
              }
            }
          },
          true,
        );
        form.addEventListener(
          'click',
          function (event) {
            var target = event.target;
            if (!target || typeof target.closest !== 'function') {
              return;
            }

            var submitter = target.closest(
              'input[type="submit"], button[type="submit"], .button-primary',
            );
            if (
              submitter &&
              !validatePasswordConfirmation(form, { showErrors: true })
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              var confirmInput = form.querySelector(
                '[data-acme-confirm-password="true"]',
              );
              if (confirmInput) {
                confirmInput.focus();
              }
            }
          },
          true,
        );
      }

      function enhancePasswordConfirmation() {
        var currentState = resolveStateCopy().key;
        if (currentState !== 'signUp' && currentState !== 'password') {
          removePasswordConfirmationFields(document);
          return;
        }

        var passwordControls = Array.prototype.slice.call(
          document.querySelectorAll(
            '#okta-login-container input[type="password"]',
          ),
        );

        passwordControls.forEach(function (passwordControl) {
          if (!shouldEnhancePasswordConfirmation(passwordControl)) {
            return;
          }

          var form = passwordControl.closest('form');
          if (!form) {
            return;
          }

          if (formHasNativePasswordConfirmation(form, passwordControl)) {
            removePasswordConfirmationFields(form);
            return;
          }

          var passwordFieldset = findPasswordFieldset(passwordControl);
          if (!passwordFieldset || !passwordFieldset.parentNode) {
            return;
          }

          var confirmationField = form.querySelector(
            '.acme-confirm-password-field',
          );
          if (!confirmationField) {
            confirmationField = buildPasswordConfirmationField(passwordControl);
          }

          if (confirmationField.previousSibling !== passwordFieldset) {
            passwordFieldset.parentNode.insertBefore(
              confirmationField,
              passwordFieldset.nextSibling,
            );
          }

          var confirmInput = confirmationField.querySelector(
            '[data-acme-confirm-password="true"]',
          );
          var validateOnInput = function () {
            validatePasswordConfirmation(form, {
              showErrors:
                confirmInput &&
                (confirmInput.value.length > 0 ||
                  confirmInput.getAttribute('aria-invalid') === 'true'),
            });
          };

          if (
            confirmInput &&
            !confirmInput.getAttribute('data-acme-confirm-password-bound')
          ) {
            confirmInput.setAttribute(
              'data-acme-confirm-password-bound',
              'true',
            );
            confirmInput.addEventListener('input', validateOnInput);
            passwordControl.addEventListener('input', validateOnInput);
          }

          bindPasswordConfirmationForm(form);
        });
      }

      function enhanceFormFieldRhythm() {
        var fieldsets = document.querySelectorAll(
          '#okta-login-container .o-form-fieldset, #okta-login-container .okta-form-fieldset, #okta-login-container .form-fieldset, #okta-login-container [data-se^="o-form-fieldset"]',
        );

        Array.prototype.forEach.call(fieldsets, function (fieldset) {
          var label =
            fieldset.querySelector('label') ||
            fieldset.querySelector('[data-se="o-form-label"]') ||
            fieldset.querySelector('.o-form-label');
          var inputContainer =
            fieldset.querySelector('[data-se="o-form-input-container"]') ||
            fieldset.querySelector('.o-form-input-container') ||
            fieldset.querySelector('.o-form-input') ||
            fieldset.querySelector(
              'input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]), select, textarea',
            );
          var fieldText = normalizeText(fieldset.textContent || '');
          var hasPrimaryControl = Array.prototype.some.call(
            fieldset.querySelectorAll('input, select, textarea'),
            isPrimaryFormControl,
          );

          if (
            !hasPrimaryControl &&
            (fieldText.indexOf('keep me signed') !== -1 ||
              fieldText.indexOf('remember me') !== -1 ||
              fieldset.getAttribute('data-se') === 'o-form-fieldset-rememberMe')
          ) {
            fieldset.classList.add('acme-remember-fieldset');
            fieldset.classList.remove('acme-remember-field');
            return;
          }

          fieldset.classList.add('acme-form-field');

          if (label) {
            label.classList.add('acme-form-field__label');
          }

          if (inputContainer) {
            inputContainer.classList.add('acme-form-field__input');
          }

          var labelText = normalizeText(label ? label.textContent : '');
          if (labelText.indexOf('state') !== -1) {
            fieldset.classList.add('acme-form-field--state');
          }
          if (labelText.indexOf('password') !== -1) {
            fieldset.classList.add('acme-form-field--password');
          }
        });

        var candidates = document.querySelectorAll(
          '#okta-login-container p, #okta-login-container div, #okta-login-container section, #okta-login-container ul',
        );

        Array.prototype.forEach.call(candidates, function (candidate) {
          var directText = Array.prototype.map
            .call(candidate.childNodes || [], function (node) {
              return node.nodeType === Node.TEXT_NODE ? node.textContent : '';
            })
            .join(' ');
          var text = normalizeText(candidate.textContent || '');
          var ownText = normalizeText(directText);
          var isList =
            candidate.tagName &&
            candidate.tagName.toLowerCase() === 'ul' &&
            (text.indexOf('at least 8 characters') !== -1 ||
              text.indexOf('lowercase letter') !== -1 ||
              text.indexOf('uppercase letter') !== -1);
          var isHeading = ownText.indexOf('password requirements') !== -1;

          if (!isHeading && !isList) {
            return;
          }

          candidate.classList.add('acme-password-requirements');

          if (isHeading) {
            var sibling = candidate.nextElementSibling;
            if (
              sibling &&
              sibling.tagName &&
              sibling.tagName.toLowerCase() === 'ul'
            ) {
              sibling.classList.add('acme-password-requirements');
            }
            Array.prototype.forEach.call(
              candidate.querySelectorAll('ul'),
              function (list) {
                list.classList.add('acme-password-requirements');
              },
            );
          }
        });
      }

      function isForgotPasswordFooterLink(link) {
        if (!link || link.nodeType !== 1) {
          return false;
        }

        var linkText = normalizeText(link.textContent);
        var dataSe = normalizeText(link.getAttribute('data-se') || '');
        var href = normalizeText(link.getAttribute('href') || '');
        return (
          linkText.indexOf('forgot password') !== -1 ||
          dataSe === 'forgot-password' ||
          dataSe === 'forgotpassword' ||
          href.indexOf('forgot-password') !== -1 ||
          href.indexOf('recover') !== -1
        );
      }

      function isUnlockAccountFooterLink(link) {
        if (!link || link.nodeType !== 1) {
          return false;
        }

        var linkText = normalizeText(link.textContent);
        var dataSe = normalizeText(link.getAttribute('data-se') || '');
        var href = normalizeText(link.getAttribute('href') || '');
        return (
          linkText.indexOf('unlock') !== -1 ||
          dataSe === 'unlock' ||
          dataSe === 'unlock-account' ||
          href.indexOf('unlock') !== -1
        );
      }

      function isRegistrationOrBackFooterLink(link) {
        if (!link || link.nodeType !== 1) {
          return false;
        }

        var text = normalizeText(link.textContent);
        var dataSe = normalizeText(link.getAttribute('data-se') || '');
        return (
          text === 'sign up' ||
          text === 'create account' ||
          text === 'register' ||
          text === 'sign in' ||
          text === 'back to sign in' ||
          text === 'already have an account?' ||
          dataSe === 'enroll' ||
          dataSe === 'back' ||
          link.classList.contains('js-enroll') ||
          link.classList.contains('js-back')
        );
      }

      function bindNativeHostedRecoveryLink(link, className, text, flow) {
        var nextFlow = normalizeRecoveryFlow(flow);
        if (!nextFlow) {
          return;
        }

        link.classList.add(className);
        link.textContent = text;
        link.setAttribute('data-acme-okta-native-flow', nextFlow);
        link.removeAttribute('data-acme-okta-flow');
        link.removeAttribute('data-acme-recovery-fallback');
      }

      function bindFallbackHostedRecoveryLink(link, className, text, flow) {
        var nextFlow = normalizeRecoveryFlow(flow);
        if (!nextFlow) {
          return;
        }

        link.classList.add(className);
        link.textContent = text;

        if (link.tagName && link.tagName.toLowerCase() === 'a') {
          link.href = getRecoveryFlowHash(nextFlow);
        } else if (link.tagName && link.tagName.toLowerCase() === 'button') {
          link.type = 'button';
        }
        link.setAttribute('role', 'button');
        link.setAttribute('tabindex', '0');
        link.setAttribute('data-acme-okta-flow', nextFlow);
        link.removeAttribute('data-acme-okta-native-flow');
        link.onclick = null;
      }

      function createRecoveryFallbackLink(className, text, flow) {
        var link = document.createElement('button');
        link.type = 'button';
        link.setAttribute('data-acme-recovery-fallback', 'true');
        bindFallbackHostedRecoveryLink(link, className, text, flow);
        return link;
      }

      function hideHostedFooterAction(link) {
        if (!link) {
          return;
        }

        link.style.setProperty('display', 'none', 'important');
        link.style.setProperty('visibility', 'hidden', 'important');
        link.setAttribute('aria-hidden', 'true');
        link.setAttribute('tabindex', '-1');
        link.removeAttribute('data-acme-okta-flow');
        link.removeAttribute('data-acme-okta-native-flow');
        link.classList.remove(
          'acme-auth-recovery-link',
          'acme-auth-unlock-link',
        );
        link.onclick = null;
      }

      function showHostedFooterAction(link) {
        if (!link) {
          return;
        }

        link.style.removeProperty('display');
        link.style.removeProperty('visibility');
        link.removeAttribute('aria-hidden');
        link.removeAttribute('tabindex');
      }

      function installHostedRecoveryRouting() {
        if (window.__acmeHostedRecoveryRoutingInstalled) {
          return;
        }

        window.__acmeHostedRecoveryRoutingInstalled = true;
        var routeRecoveryInteraction = function (event) {
          if (
            event.type === 'keydown' &&
            event.key !== 'Enter' &&
            event.key !== ' '
          ) {
            return;
          }

          var now = Date.now();
          if (
            window.__acmeLastRecoveryRouteAt &&
            now - window.__acmeLastRecoveryRouteAt < 350
          ) {
            if (event) {
              event.preventDefault();
              event.stopPropagation();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
            return;
          }

          var target = event.target;
          if (!target || typeof target.closest !== 'function') {
            return;
          }

          var link = target.closest(
            '#okta-login-container .acme-auth-recovery-link, #okta-login-container .acme-auth-unlock-link',
          );
          if (!link) {
            return;
          }

          var flow = normalizeRecoveryFlow(
            link.getAttribute('data-acme-okta-flow'),
          );
          if (!flow) {
            return;
          }

          window.__acmeLastRecoveryRouteAt = now;
          routeToHostedRecoveryFlow(event, flow);
        };

        ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(
          function (eventName) {
            document.addEventListener(
              eventName,
              routeRecoveryInteraction,
              true,
            );
          },
        );

        window.addEventListener('popstate', function () {
          renderOktaWidget(getRecoveryFlowFromHash());
        });
        window.addEventListener('hashchange', function () {
          renderOktaWidget(getRecoveryFlowFromHash());
        });
      }

      function enhanceWidgetFooter() {
        var footer = document.querySelector(
          '#okta-login-container .siw-main-footer',
        );
        if (!footer) {
          return;
        }

        var currentState = resolveStateCopy().key;
        var footerLinks = Array.prototype.slice.call(
          footer.querySelectorAll('a'),
        );
        footerLinks.forEach(function (link) {
          var linkText = normalizeText(link.textContent);
          var href = link.getAttribute('href') || '';
          var dataSe = link.getAttribute('data-se') || '';
          var isHelpLink =
            linkText === 'help' ||
            dataSe === 'help' ||
            link.classList.contains('js-help') ||
            /\/help(?:\/|$)|\/help\/login/i.test(href);

          if (!isHelpLink) {
            return;
          }

          hideHostedFooterAction(link);
        });

        var recoveryRow = footer.querySelector('.acme-recovery-row');
        if (currentState === 'signIn') {
          if (!recoveryRow) {
            recoveryRow = document.createElement('div');
            recoveryRow.className = 'acme-recovery-row';
            footer.insertBefore(recoveryRow, footer.firstChild);
          }

          recoveryRow.style.display = 'inline-flex';

          var nativeForgotPasswordLink = footerLinks.find(function (link) {
            return (
              !link.getAttribute('data-acme-recovery-fallback') &&
              isForgotPasswordFooterLink(link)
            );
          });

          footerLinks.forEach(function (link) {
            if (
              link.getAttribute('data-acme-recovery-fallback') ||
              (!isForgotPasswordFooterLink(link) &&
                !isUnlockAccountFooterLink(link))
            ) {
              return;
            }

            if (link !== nativeForgotPasswordLink) {
              hideHostedFooterAction(link);
            }
          });

          var forgotPasswordLink = nativeForgotPasswordLink;
          if (forgotPasswordLink) {
            bindNativeHostedRecoveryLink(
              forgotPasswordLink,
              'acme-auth-recovery-link',
              'Forgot password?',
              'resetPassword',
            );
          } else {
            forgotPasswordLink = footer.querySelector(
              '.acme-auth-recovery-link[data-acme-recovery-fallback="true"]',
            );
            if (!forgotPasswordLink) {
              forgotPasswordLink = footer.querySelector(
                '[data-acme-recovery-fallback="true"][data-acme-okta-flow="resetPassword"]',
              );
            }
            if (!forgotPasswordLink) {
              forgotPasswordLink = createRecoveryFallbackLink(
                'acme-auth-recovery-link',
                'Forgot password?',
                'resetPassword',
              );
            }
            bindFallbackHostedRecoveryLink(
              forgotPasswordLink,
              'acme-auth-recovery-link',
              'Forgot password?',
              'resetPassword',
            );
          }

          Array.prototype.slice
            .call(
              footer.querySelectorAll(
                '[data-acme-recovery-fallback="true"][data-acme-okta-flow="resetPassword"]',
              ),
            )
            .forEach(function (fallbackLink) {
              if (fallbackLink !== forgotPasswordLink) {
                hideHostedFooterAction(fallbackLink);
              }
            });

          if (!forgotPasswordLink) {
            forgotPasswordLink = createRecoveryFallbackLink(
              'acme-auth-recovery-link',
              'Forgot password?',
              'resetPassword',
            );
          }
          showHostedFooterAction(forgotPasswordLink);

          while (recoveryRow.firstChild) {
            recoveryRow.removeChild(recoveryRow.firstChild);
          }

          recoveryRow.appendChild(forgotPasswordLink);
        } else if (recoveryRow) {
          recoveryRow.style.display = 'none';
        }

        var registrationLink =
          footer.querySelector('.registration-link') ||
          footer.querySelector('.js-back') ||
          footer.querySelector('[data-se="back"]') ||
          footerLinks.find(function (link) {
            return isRegistrationOrBackFooterLink(link);
          });
        if (!registrationLink) {
          return;
        }

        registrationLink.classList.add('acme-registration-link');

        var row =
          registrationLink.closest('.signup-info') ||
          registrationLink.closest('.registration-container') ||
          registrationLink.parentElement;
        if (!row) {
          return;
        }

        var promptText =
          currentState === 'signUp'
            ? 'Already have an account?'
            : 'Do not have an account?';
        var actionText = currentState === 'signUp' ? 'Sign in' : 'Sign up';

        if (
          !row ||
          row === footer ||
          row.classList.contains('siw-main-footer')
        ) {
          row = footer.querySelector('.acme-registration-row');
          if (!row) {
            row = document.createElement('div');
            row.className = 'acme-registration-row';
            footer.appendChild(row);
          }
          row.appendChild(registrationLink);
        }

        row.classList.add('acme-registration-row');
        registrationLink.textContent = actionText;

        if (registrationLink.parentElement !== row) {
          row.insertBefore(registrationLink, row.firstChild);
        }

        Array.prototype.slice.call(row.childNodes).forEach(function (node) {
          if (node !== registrationLink) {
            row.removeChild(node);
          }
        });

        var promptNode = row.querySelector('.acme-registration-prompt');
        if (!promptNode) {
          promptNode = document.createElement('span');
          promptNode.className = 'acme-registration-prompt';
          row.insertBefore(promptNode, registrationLink);
        }

        promptNode.textContent = promptText;
      }

      function syncHostedExperience() {
        installHostedRecoveryRouting();
        updateExperienceCopy();
        enhanceAuthenticatorOptions();
        enhanceRadioOptions();
        enhanceEmailCodeFallback();
        enhanceRecoveryHints();
        enhanceIdentifierContrast();
        enhancePasswordConfirmation();
        enhanceInputErrors();
        enhanceRememberMeFields();
        enhanceFormFieldRhythm();
        enhanceWidgetFooter();
      }

      function observeWidgetUpdates() {
        var container = document.getElementById('okta-login-container');
        if (!container || typeof MutationObserver === 'undefined') {
          return;
        }

        var pendingFrame = 0;
        var scheduleSync = function () {
          if (pendingFrame) {
            return;
          }

          pendingFrame = window.requestAnimationFrame
            ? window.requestAnimationFrame(function () {
                pendingFrame = 0;
                syncHostedExperience();
              })
            : window.setTimeout(function () {
                pendingFrame = 0;
                syncHostedExperience();
              }, 0);
        };

        var observer = new MutationObserver(scheduleSync);
        observer.observe(container, {
          childList: true,
          subtree: true,
          attributes: true,
        });
      }

      var oktaSignIn = null;
      var currentOktaFlow = null;

      function createOktaWidgetConfig(flow) {
        var config = OktaUtil.getSignInWidgetConfig();
        var nextFlow = normalizeRecoveryFlow(flow);

        config.features = Object.assign({}, config.features || {}, {
          rememberMe: false,
          registration: true,
          selfServiceUnlock: false,
          emailRecovery: true,
          smsRecovery: true,
          callRecovery: false,
        });
        config['features.rememberMe'] = false;
        config['features.registration'] = true;
        config['features.selfServiceUnlock'] = false;
        config['features.emailRecovery'] = true;
        config['features.smsRecovery'] = true;
        config['features.callRecovery'] = false;
        config.i18n = Object.assign({}, config.i18n || {}, {
          en: Object.assign(
            {},
            config.i18n && config.i18n.en ? config.i18n.en : {},
            {
              'primaryauth.remember': 'Remember me',
              remember: 'Remember me',
            },
          ),
        });

        if (nextFlow) {
          config.flow = nextFlow;
        } else if (
          config.flow === 'resetPassword' ||
          config.flow === 'unlockAccount'
        ) {
          delete config.flow;
        }

        return config;
      }

      function renderOktaWidget(flow) {
        var nextFlow = normalizeRecoveryFlow(flow);
        if (currentOktaFlow === nextFlow && oktaSignIn) {
          syncHostedExperience();
          return;
        }

        currentOktaFlow = nextFlow;
        if (oktaSignIn && typeof oktaSignIn.remove === 'function') {
          oktaSignIn.remove();
        }

        oktaSignIn = new OktaSignIn(createOktaWidgetConfig(nextFlow));
        oktaSignIn.renderEl(
          { el: '#okta-login-container' },
          OktaUtil.completeLogin,
          function (error) {
            console.log(error.message, error);
          },
        );

        window.setTimeout(syncHostedExperience, 0);
      }

      installHostedRecoveryRouting();
      observeWidgetUpdates();
      renderOktaWidget(getRecoveryFlowFromHash());
    </script>
  </body>
</html>
