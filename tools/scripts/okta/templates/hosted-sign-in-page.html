<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="acme-sign-in-start-url"
      content="<!-- %%SIGN_IN_START_URL%% -->"
    />
    <link href="{{themedStylesUrl}}" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" href="{{faviconUrl}}" type="image/x-icon" />

    <title>{{pageTitle}}</title>
    {{{SignInWidgetResources}}}
    <!-- %%THEME_BOOTSTRAP_SCRIPT%% -->
    <!-- %%THEME_STYLE_MARKUP%% -->
  </head>
  <body>
    <div id="login-bg-image-id" class="login-bg-image tb--background"></div>
    <!-- %%BRAND_HEADER_MARKUP%% -->
    <main class="acme-auth-page">
      <div class="acme-auth-layout">
        <section class="acme-auth-context" aria-labelledby="acme-auth-title">
          <p class="acme-auth-eyebrow" data-acme-auth-copy="eyebrow">
            Customer sign in
          </p>
          <h1
            id="acme-auth-title"
            class="acme-auth-title"
            data-acme-auth-copy="title"
          >
            <!-- %%SIGN_IN_TITLE%% -->
          </h1>
          <p class="acme-auth-subtitle" data-acme-auth-copy="subtitle">
            <!-- %%SIGN_IN_SUBTITLE%% -->
          </p>
          <p class="acme-auth-existing-account">
            Already have an account?
            <a href="#" data-acme-auth-sign-in-link>Sign in</a>
          </p>
        </section>
        <section class="acme-auth-widget" aria-label="Account access">
          <div id="okta-login-container"></div>
        </section>
      </div>
      <!-- %%SUPPORT_FOOTER_MARKUP%% -->
    </main>

    {{{OktaUtil}}}
    <!-- %%THEME_CONTROLLER_SCRIPT%% -->
    <script type="text/javascript" nonce="{{nonceValue}}">
      /* %%HOSTED_SIGN_IN_CONTROLLER%% */
    </script>
  </body>
</html>
